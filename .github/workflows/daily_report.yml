name: CEO Morning Intelligence Updater

on:
  schedule:
    - cron: '0 4 * * *' # 7:00 AM Addis Ababa Time
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install nodemailer axios cheerio

      - name: Run Daily Intelligence Mailer
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: node daily_mailer.js
